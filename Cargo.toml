[package]
name = "seiche"
version = "0.1.0"
edition = "2021"
description = "Height-ordered incremental computation DAG, cutoff propagation, O(1) incremental folds, idempotent delta algebra, sequence-gap book reconstruction, and VOPR simulation testing for prediction-market orderbooks."
license = "MIT"
repository = "https://github.com/copyleftdev/seiche"
homepage = "https://github.com/copyleftdev/seiche"
documentation = "https://github.com/copyleftdev/seiche#readme"
readme = "README.md"
keywords = ["incremental", "kalshi", "orderbook", "trading", "dst"]
categories = ["algorithms", "command-line-utilities", "finance"]

[lib]
name = "seiche"
path = "src/lib.rs"

[[bin]]
name = "seiche"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
