<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seiche</title>
<meta name="description" content="Living incremental DAG &amp; VOPR propagation canvas for Kalshi prediction-market orderbooks.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-trench: #0c0a1d;
  --fg-ink:    #e2e8f0;
  --fg-dim:    #7c8aa6;
  --cyan:      #00f0ff;
  --orchid:    #c084fc;
  --mint:      #10f5a0;
  --coral:     #ff6b6b;
  --font-mono: 'IBM Plex Mono', monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-trench);
  color: var(--fg-ink);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

canvas#seiche-stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: block;
  cursor: crosshair;
}

/* Minimal translucent floating pill at bottom-center — recedes into the canvas */
.dock {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.45rem 0.65rem;
  border-radius: 999px;
  background: rgba(16, 13, 38, 0.72);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(192, 132, 252, 0.18);
}

.dock-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--fg-ink);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  padding: 0.35rem 0.8rem;
  cursor: pointer;
  transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
  white-space: nowrap;
}

.dock-btn:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(0, 240, 255, 0.08);
}

.dock-btn:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

.dock-btn.active {
  border-color: rgba(16, 245, 160, 0.45);
  color: var(--mint);
}
</style>
</head>
<body>

<canvas id="seiche-stage"></canvas>

<nav class="dock" aria-label="Impulse Controls">
  <button type="button" id="btn-toggle" class="dock-btn active">Live Flow</button>
  <button type="button" id="btn-pyth" class="dock-btn">Pyth XAU Wave</button>
  <button type="button" id="btn-nws" class="dock-btn">NWS KORD Wave</button>
  <button type="button" id="btn-spike" class="dock-btn">Intra-Hour Harvest</button>
  <button type="button" id="btn-cutoff" class="dock-btn">Cutoff Deadband</button>
  <button type="button" id="btn-burst" class="dock-btn">Resonant Cascade</button>
</nav>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// SEICHE // PURE FULL-BLEED INCREMENTAL DAG VISUALIZATION
// Zero sidebars, zero headers, zero footers. All telemetry lives directly inside
// the luminous nodes and standing-wave bloom of the 6-layer Kalshi DAG:
//   H=0: 6 External Oracles (Pyth XAU, ICE EUR, Yahoo SPX, NWS KORD, Pinnacle NHL, FanDuel NFL)
//   H=1: 36 Kalshi Contract Leaves + Cutoff::Band(25cc) Gate
//   H=2: 36 Fee & Harvest Compute Nodes (0.07 * C * P * (1 - P))
//   H=3: 6 Mutually-Exclusive Series IncrFoldSum Aggregators (O(1) Δ)
//   H=4: 1 Master Portfolio Exposure & S4 Algebraic Delta Apex
//   Total: 85 Nodes, 114 Bezier Filaments
// ═══════════════════════════════════════════════════════════════════════════
(function() {
  const canvas = document.getElementById('seiche-stage');
  const ctx = canvas.getContext('2d');

  // Deep Pelagic Indigo + Bioluminescent Palette
  const BG_TOP    = '#0c0a1d';
  const BG_BOTTOM = '#060510';
  const COL_CYAN  = '#00f0ff'; // Leaf & Oracle impulse
  const COL_ORCHID= '#c084fc'; // Compute & IncrFold
  const COL_MINT  = '#10f5a0'; // Harvest Exit & S4 Apex
  const COL_CORAL = '#ff6b6b'; // Cutoff Deadband / WS Gap

  let w = window.innerWidth;
  let h = window.innerHeight;

  // Deterministic SplitMix64 PRNG
  let prng = 20261029 >>> 0;
  function rand() {
    prng = (prng + 0x9e3779b9) >>> 0;
    let z = prng;
    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b) >>> 0;
    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35) >>> 0;
    return ((z ^ (z >>> 16)) >>> 0) / 4294967296;
  }

  const ORACLES = [
    { label: 'PYTH:XAU',   val: '4025.5' },
    { label: 'ICE:EURUSD', val: '1.1142' },
    { label: 'YAHOO:SPX',  val: '7736.8' },
    { label: 'NWS:KORD',   val: '71.4°F' },
    { label: 'PINN:NHL',   val: 'ANA+128'},
    { label: 'FD:NFL',     val: 'GB-380' }
  ];

  // 36 Kalshi contract leaves (6 per oracle family) for a grand, wide canopy
  const SERIES_CODES = ['GOLDH', 'EURUSD', 'INXU', 'HIGHCHI', 'NHLGAME', 'NFLGAME'];
  const LEAVES = [];
  for (let fam = 0; fam < 6; fam++) {
    for (let k = 0; k < 6; k++) {
      const baseBid = fam < 4 ? (8600 + k * 150) : (3200 + k * 600);
      LEAVES.push({
        tk: `${SERIES_CODES[fam]}-${k + 1}`,
        fam,
        bid: baseBid,
        entry: baseBid - 120,
        qty: fam === 3 ? 1100 : 500
      });
    }
  }

  const FOLDS = [
    { label: 'FOLD:XAU', sum: 54900 },
    { label: 'FOLD:FX',  sum: 53800 },
    { label: 'FOLD:SPX', sum: 55200 },
    { label: 'FOLD:WX',  sum: 53100 },
    { label: 'FOLD:NHL', sum: 28200 },
    { label: 'FOLD:NFL', sum: 29400 }
  ];

  const nodes = [];
  const edges = [];
  const pulses = [];
  const rings = [];
  const floatTags = [];

  let hoveredNodeId = -1;
  let running = true;
  let liveSseConnected = false;
  let lastStabilizeNs = 184;
  let lastTouched = 4;
  let totalEvents = 0;
  let totalCutoffs = 0;
  let totalHarvests = 0;

  function buildGraph() {
    const dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    nodes.length = 0;
    edges.length = 0;

    const padX = Math.max(48, w * 0.055);
    const usableW = w - padX * 2;

    // Expanded vertical breathing room across the full viewport
    const yH0 = h * 0.11; // 6 Oracles
    const yH1 = h * 0.30; // 36 Contract Leaves
    const yH2 = h * 0.51; // 36 Compute Gates
    const yH3 = h * 0.72; // 6 IncrFolds
    const yH4 = h * 0.87; // 1 S4 Output Apex

    // H=0: 6 Oracles (ids 0..5)
    for (let i = 0; i < 6; i++) {
      const x = padX + (usableW * (i + 0.5)) / 6;
      nodes.push({
        id: nodes.length,
        layer: 0,
        x,
        y: yH0,
        r: 4.5,
        label: ORACLES[i].label,
        sub: ORACLES[i].val,
        glow: 0,
        color: COL_CYAN,
        fam: i
      });
    }

    // H=1: 36 Contract Leaves (ids 6..41)
    const leafStart = nodes.length;
    for (let i = 0; i < 36; i++) {
      const x = padX + (usableW * i) / 35;
      const fam = LEAVES[i].fam;
      const id = nodes.length;
      nodes.push({
        id,
        layer: 1,
        x,
        y: yH1 + Math.sin(i * 0.55) * 6,
        r: 3.0,
        label: LEAVES[i].tk,
        sub: (LEAVES[i].bid / 100).toFixed(0) + '¢',
        glow: 0,
        cutoffGlow: 0,
        color: COL_CYAN,
        leafIdx: i,
        fam
      });
      edges.push({ from: fam, to: id, glow: 0, color: COL_CYAN });
    }

    // H=2: 36 Compute Nodes (ids 42..77)
    const compStart = nodes.length;
    for (let i = 0; i < 36; i++) {
      const x = padX + (usableW * i) / 35;
      const fam = LEAVES[i].fam;
      const id = nodes.length;
      nodes.push({
        id,
        layer: 2,
        x,
        y: yH2 + Math.cos(i * 0.55) * 6,
        r: 2.6,
        label: 'GATE',
        sub: '',
        glow: 0,
        color: COL_ORCHID,
        leafIdx: i,
        fam
      });
      edges.push({ from: leafStart + i, to: id, glow: 0, color: COL_CYAN });
    }

    // H=3: 6 IncrFoldSum Nodes (ids 78..83)
    const foldStart = nodes.length;
    for (let f = 0; f < 6; f++) {
      const x = padX + (usableW * (f + 0.5)) / 6;
      const id = nodes.length;
      nodes.push({
        id,
        layer: 3,
        x,
        y: yH3,
        r: 6.0,
        label: FOLDS[f].label,
        sub: 'O(1) Δ',
        glow: 0,
        color: COL_ORCHID,
        fam: f
      });
    }
    for (let i = 0; i < 36; i++) {
      edges.push({
        from: compStart + i,
        to: foldStart + LEAVES[i].fam,
        glow: 0,
        color: COL_ORCHID
      });
    }

    // H=4: 1 Master Output Apex (id 84)
    const apexId = nodes.length;
    nodes.push({
      id: apexId,
      layer: 4,
      x: w * 0.5,
      y: yH4,
      r: 7.5,
      label: 'SEICHE S4 DELTA',
      sub: '184ns · 4/85',
      glow: 0,
      color: COL_MINT
    });
    for (let f = 0; f < 6; f++) {
      edges.push({ from: foldStart + f, to: apexId, glow: 0, color: COL_MINT });
    }
  }

  function spawnRing(x, y, color, maxR) {
    if (rings.length >= 24) rings.shift();
    rings.push({ x, y, r: 3, maxR: maxR || 34, alpha: 0.72, color });
  }

  function spawnFloatTag(x, y, text, color) {
    if (floatTags.length >= 16) floatTags.shift();
    floatTags.push({ x, y: y - 8, vy: -0.38, alpha: 0.95, text, color });
  }

  function activateEdge(fromId, toId, color, speed) {
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      if (e.from === fromId && e.to === toId) {
        e.glow = 1.0;
        e.color = color;
        if (pulses.length >= 36) pulses.shift();
        const f = nodes[fromId];
        const t = nodes[toId];
        pulses.push({
          fx: f.x, fy: f.y,
          tx: t.x, ty: t.y,
          p: 0,
          speed: speed || 0.048,
          color,
          trail: []
        });
        break;
      }
    }
  }

  function fireLeaf(leafIdx, deltaCc, customTicker, customNs) {
    totalEvents++;
    const lf = LEAVES[leafIdx];
    if (customTicker) {
      lf.tk = customTicker.replace(/^KX/, '').slice(0, 13);
      nodes[6 + leafIdx].label = lf.tk;
    }

    const oraId = lf.fam;
    const leafNodeId = 6 + leafIdx;
    const compNodeId = 42 + leafIdx;
    const foldNodeId = 78 + lf.fam;
    const apexNodeId = 84;

    nodes[oraId].glow = Math.max(nodes[oraId].glow, 0.85);
    activateEdge(oraId, leafNodeId, COL_CYAN, 0.065);

    // Cutoff::Band(25cc) deadband check
    if (Math.abs(deltaCc) < 25) {
      totalCutoffs++;
      lastTouched = 0;
      lastStabilizeNs = customNs || (52 + Math.floor(rand() * 24));
      nodes[leafNodeId].cutoffGlow = 1.0;
      spawnRing(nodes[leafNodeId].x, nodes[leafNodeId].y, COL_CORAL, 24);
      spawnFloatTag(nodes[leafNodeId].x, nodes[leafNodeId].y, 'CUTOFF <0.25¢', COL_CORAL);
      nodes[apexNodeId].sub = `${lastStabilizeNs}ns · 0/${nodes.length}`;
      return;
    }

    lf.bid = Math.max(200, Math.min(9800, lf.bid + deltaCc));
    nodes[leafNodeId].sub = (lf.bid / 100).toFixed(0) + '¢';
    nodes[leafNodeId].glow = 1.0;
    spawnRing(nodes[leafNodeId].x, nodes[leafNodeId].y, COL_CYAN, 26);

    activateEdge(leafNodeId, compNodeId, COL_CYAN, 0.055);

    setTimeout(() => {
      if (!nodes[compNodeId]) return;
      nodes[compNodeId].glow = 1.0;
      activateEdge(compNodeId, foldNodeId, COL_ORCHID, 0.048);
    }, 55);

    setTimeout(() => {
      if (!nodes[foldNodeId]) return;
      nodes[foldNodeId].glow = 1.0;
      spawnRing(nodes[foldNodeId].x, nodes[foldNodeId].y, COL_ORCHID, 34);
      activateEdge(foldNodeId, apexNodeId, COL_MINT, 0.052);
    }, 125);

    setTimeout(() => {
      if (!nodes[apexNodeId]) return;
      nodes[apexNodeId].glow = 1.0;
      const p = lf.bid / 10000;
      const feeCc = Math.round(700 * (lf.qty / 100) * p * (1 - p));
      const grossCc = Math.round(((lf.bid - lf.entry) * lf.qty) / 100);
      const netCc = grossCc - feeCc;

      lastStabilizeNs = customNs || (168 + Math.floor(rand() * 28));
      lastTouched = 4;
      nodes[apexNodeId].sub = `${lastStabilizeNs}ns · 4/${nodes.length}`;

      if (netCc >= 250) {
        totalHarvests++;
        lf.entry = lf.bid;
        spawnRing(nodes[apexNodeId].x, nodes[apexNodeId].y, COL_MINT, 54);
        spawnFloatTag(
          nodes[apexNodeId].x,
          nodes[apexNodeId].y,
          `HARVEST ${lf.tk} +$${(netCc / 10000).toFixed(2)}`,
          COL_MINT
        );
      } else {
        spawnRing(nodes[apexNodeId].x, nodes[apexNodeId].y, COL_MINT, 34);
      }
    }, 195);
  }

  function stepOrganic() {
    const idx = Math.floor(rand() * 36);
    if (rand() < 0.28) {
      const micro = Math.floor((rand() - 0.5) * 36);
      fireLeaf(idx, micro);
    } else {
      const move = (rand() > 0.44 ? 1 : -1) * (50 + Math.floor(rand() * 190));
      fireLeaf(idx, move);
    }
  }

  // Hover & click directly on nodes
  canvas.addEventListener('mousemove', function(ev) {
    const mx = ev.clientX;
    const my = ev.clientY;
    hoveredNodeId = -1;
    for (const n of nodes) {
      const dx = mx - n.x;
      const dy = my - n.y;
      if (dx * dx + dy * dy <= 256) {
        hoveredNodeId = n.id;
        break;
      }
    }
  });

  canvas.addEventListener('click', function(ev) {
    const mx = ev.clientX;
    const my = ev.clientY;
    for (const n of nodes) {
      const dx = mx - n.x;
      const dy = my - n.y;
      if (dx * dx + dy * dy <= 324) {
        if (typeof n.leafIdx === 'number') {
          fireLeaf(n.leafIdx, 240);
          return;
        }
        if (n.layer === 0 && typeof n.fam === 'number') {
          for (let k = 0; k < 6; k++) {
            setTimeout(() => fireLeaf(n.fam * 6 + k, 180), k * 35);
          }
          return;
        }
      }
    }
  });

  // Minimal floating dock controls
  document.getElementById('btn-toggle').addEventListener('click', function() {
    running = !running;
    this.classList.toggle('active', running);
    this.textContent = running ? 'Live Flow' : 'Paused';
  });

  document.getElementById('btn-pyth').addEventListener('click', function() {
    for (let k = 0; k < 6; k++) {
      setTimeout(() => fireLeaf(k, 230), k * 35);
    }
  });

  document.getElementById('btn-nws').addEventListener('click', function() {
    for (let k = 0; k < 6; k++) {
      setTimeout(() => fireLeaf(18 + k, 240), k * 35);
    }
  });

  document.getElementById('btn-spike').addEventListener('click', function() {
    const idx = 26; // NHL slot
    LEAVES[idx].entry = 4700;
    LEAVES[idx].bid = 4700;
    fireLeaf(idx, 1900, 'KXNHLGAME-FLA');
  });

  document.getElementById('btn-cutoff').addEventListener('click', function() {
    for (let k = 0; k < 4; k++) {
      setTimeout(() => fireLeaf(Math.floor(rand() * 36), 12), k * 60);
    }
  });

  document.getElementById('btn-burst').addEventListener('click', function() {
    for (let k = 0; k < 14; k++) {
      setTimeout(stepOrganic, k * 55);
    }
  });

  // Auto-attach to local `seiche serve` (:8790/events) if running, with client-side 90ms frame gate
  let lastSseProcessedAt = 0;
  function connectLiveSocket() {
    const url = (window.location.port === '8790') ? '/events' : 'http://127.0.0.1:8790/events';
    try {
      const es = new EventSource(url);
      es.addEventListener('status', function() {
        liveSseConnected = true;
      });
      es.addEventListener('dag', function(ev) {
        const nowMs = performance.now();
        if (nowMs - lastSseProcessedAt < 90) return;
        lastSseProcessedAt = nowMs;
        try {
          const d = JSON.parse(ev.data);
          liveSseConnected = true;
          if (typeof d.cutoffs === 'number') {
            totalCutoffs = d.cutoffs;
          }
          if (d.kind === 'tick') {
            const slot18 = (typeof d.slot === 'number') ? (d.slot % 18) : 0;
            const leafIdx = (slot18 * 2 + (d.seq ? (d.seq % 2) : 0)) % 36;
            const deltaCc = (typeof d.delta_cc === 'number') ? d.delta_cc : 0;
            fireLeaf(leafIdx, deltaCc, d.ticker, d.ns);
          } else if (d.kind === 'gap' || d.kind === 'resync') {
            const slot18 = (typeof d.slot === 'number') ? (d.slot % 18) : 0;
            const leafIdx = (slot18 * 2) % 36;
            const ln = nodes[6 + leafIdx];
            if (ln) {
              ln.cutoffGlow = 1.0;
              spawnRing(ln.x, ln.y, COL_CORAL, 36);
              spawnFloatTag(ln.x, ln.y, `WS GAP #${d.seq || ''}`, COL_CORAL);
            }
          }
        } catch (_) {}
      });
      es.onerror = function() {
        liveSseConnected = false;
      };
    } catch (_) {}
  }
  connectLiveSocket();

  function render(now) {
    // Deep pelagic gradient background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, BG_TOP);
    bgGrad.addColorStop(1, BG_BOTTOM);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Ambient radial bloom behind the IncrFold & Apex core
    const amb = ctx.createRadialGradient(w * 0.5, h * 0.65, 10, w * 0.5, h * 0.65, w * 0.42);
    amb.addColorStop(0, 'rgba(192, 132, 252, 0.045)');
    amb.addColorStop(0.5, 'rgba(0, 240, 255, 0.02)');
    amb.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, w, h);

    // Whisper-quiet watermark telemetry inside the top-left of the canvas itself
    ctx.font = '500 11px "IBM Plex Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(226, 232, 240, 0.42)';
    ctx.fillText(
      `seiche  ·  ${liveSseConnected ? 'KALSHI LIVE WS' : 'VOPR STREAM'}  ·  ${lastStabilizeNs}ns  ·  ${lastTouched}/${nodes.length} nodes  ·  ${totalCutoffs} cutoffs  ·  ${totalHarvests} harvests`,
      28,
      32
    );

    // 1. Draw delicate cubic-bezier filaments (0.45px idle, 1.25px active with zero-shadowBlur additive glow)
    for (let i = 0; i < edges.length; i++) {
      const e = edges[i];
      const f = nodes[e.from];
      const t = nodes[e.to];

      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      const midY = (f.y + t.y) * 0.5;
      ctx.bezierCurveTo(f.x, midY, t.x, midY, t.x, t.y);

      if (e.glow > 0.02) {
        // Soft wide under-stroke for bloom without expensive CPU shadowBlur
        ctx.strokeStyle = e.color;
        ctx.globalAlpha = e.glow * 0.18;
        ctx.lineWidth = 4.0;
        ctx.stroke();

        // Crisp core filament
        ctx.globalAlpha = Math.min(0.92, e.glow * 0.85);
        ctx.lineWidth = 1.15;
        ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.strokeStyle = 'rgba(148, 163, 196, 0.11)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
      e.glow *= 0.935;
    }

    // 2. Draw expanding concentric seiche wave rings (pure additivelighter, zero shadowBlur)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.r += (rg.maxR - rg.r) * 0.085;
      rg.alpha *= 0.93;
      if (rg.alpha < 0.025) {
        rings.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
      ctx.strokeStyle = rg.color;
      ctx.globalAlpha = rg.alpha * 0.55;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }

    // 3. Draw luminous traveling comet pulses along bezier curves
    for (let i = pulses.length - 1; i >= 0; i--) {
      const pl = pulses[i];
      pl.p += pl.speed;
      if (pl.p >= 1) {
        pulses.splice(i, 1);
        continue;
      }
      const u = pl.p;
      const inv = 1 - u;
      const midY = (pl.fy + pl.ty) * 0.5;
      const cx =
        inv * inv * inv * pl.fx +
        3 * inv * inv * u * pl.fx +
        3 * inv * u * u * pl.tx +
        u * u * u * pl.tx;
      const cy =
        inv * inv * inv * pl.fy +
        3 * inv * inv * u * midY +
        3 * inv * u * u * midY +
        u * u * u * pl.ty;

      pl.trail.push({ x: cx, y: cy });
      if (pl.trail.length > 6) pl.trail.shift();

      if (pl.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(pl.trail[0].x, pl.trail[0].y);
        for (let k = 1; k < pl.trail.length; k++) {
          ctx.lineTo(pl.trail[k].x, pl.trail[k].y);
        }
        ctx.strokeStyle = pl.color;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      }

      // Soft outer halo + crisp pinpoint center (hardware-fast concentric circles)
      ctx.beginPath();
      ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = pl.color;
      ctx.globalAlpha = 0.28;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, 2.0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.95;
      ctx.fill();
    }

    // 4. Draw delicate nodes with concentric additive bloom (zero shadowBlur!)
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const isHovered = (n.id === hoveredNodeId);
      const breathe = 1 + Math.sin(now * 0.0025 + i * 0.7) * 0.08;
      const r = n.r * breathe + (isHovered ? 1.8 : 0);

      if (n.cutoffGlow && n.cutoffGlow > 0.04) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 3.0, 0, Math.PI * 2);
        ctx.fillStyle = COL_CORAL;
        ctx.globalAlpha = n.cutoffGlow * 0.24;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 1.0, 0, Math.PI * 2);
        ctx.fillStyle = COL_CORAL;
        ctx.globalAlpha = 0.92;
        ctx.fill();
        n.cutoffGlow *= 0.91;
      } else if (n.glow > 0.03 || isHovered) {
        const g = Math.max(n.glow, isHovered ? 0.7 : 0);
        // Outer soft bloom halo
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 3.4, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.globalAlpha = g * 0.14;
        ctx.fill();

        // Mid bloom halo
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 1.9, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.globalAlpha = g * 0.32;
        ctx.fill();

        // Crisp hot center
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.95;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(148, 163, 196, 0.32)';
        ctx.globalAlpha = 1;
        ctx.fill();
      }

      n.glow *= 0.94;
    }
    ctx.restore();

    // 5. Draw node labels ONLY for anchors/folds/apex or currently glowing/hovered leaves
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const isHovered = (n.id === hoveredNodeId);
      const showLabel =
        n.layer === 0 ||
        n.layer >= 3 ||
        isHovered ||
        n.glow > 0.18 ||
        (n.cutoffGlow && n.cutoffGlow > 0.18);

      if (!showLabel) continue;

      const alpha = (n.layer === 0 || n.layer >= 3 || isHovered)
        ? 0.78
        : Math.min(0.92, Math.max(n.glow, n.cutoffGlow || 0));

      ctx.textAlign = 'center';
      ctx.font = (n.layer >= 3 || n.layer === 0)
        ? '500 9.5px "IBM Plex Mono", monospace'
        : '500 8.5px "IBM Plex Mono", monospace';
      ctx.fillStyle = `rgba(226, 232, 240, ${alpha})`;
      const yOffset = n.layer === 0 ? -(n.r + 14) : (n.r + 13);
      ctx.fillText(n.label, n.x, n.y + yOffset);

      if (n.sub) {
        ctx.fillStyle = n.glow > 0.15 ? n.color : `rgba(124, 138, 166, ${alpha * 0.85})`;
        ctx.fillText(n.sub, n.x, n.y + yOffset + (n.layer === 0 ? 10 : 10));
      }
    }

    // 6. Floating micro-tags on cutoff / harvest events
    for (let i = floatTags.length - 1; i >= 0; i--) {
      const ft = floatTags[i];
      ft.y += ft.vy;
      ft.alpha *= 0.965;
      if (ft.alpha < 0.04) {
        floatTags.splice(i, 1);
        continue;
      }
      ctx.font = '500 9px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = ft.color;
      ctx.globalAlpha = ft.alpha;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.globalAlpha = 1;
    }
  }

  buildGraph();
  window.addEventListener('resize', buildGraph);

  let lastSimStep = performance.now();
  function loop(now) {
    if (running && !liveSseConnected && now - lastSimStep > 310) {
      stepOrganic();
      lastSimStep = now;
    }
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
